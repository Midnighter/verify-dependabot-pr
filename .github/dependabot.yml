version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    cooldown:
      default-days: 14
      semver-major-days: 21

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - ci
    cooldown:
      default-days: 14

  # The tool versions in .github/tool-requirements.txt, which the checks pass to
  # `uvx --constraints`.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - ci
    cooldown:
      default-days: 14
      semver-major-days: 21
