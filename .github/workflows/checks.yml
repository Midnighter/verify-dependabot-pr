name: Checks

# The repository's checks, in one place, called by CI for every push and pull
# request and by the release workflow before it builds. Nothing here produces a
# release artifact: the release workflow's build job installs only the npm
# packages and runs esbuild, so a compromised linter or test dependency cannot
# reach the bundle that gets attested.

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run lint:shell
      - run: npm run lint:workflows
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      # Builds here only to prove the bundle compiles. The release workflow
      # builds the artifact it ships in a job of its own.
      - run: npm run build

  # Runs the built action against this repository's own pull requests. The unit
  # and acceptance suites mock the API, so they cannot catch a rule tightened
  # until it rejects genuine Dependabot PRs; this job can. It needs no write
  # access and makes two API calls per pull request it checks.
  live:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Checks the bundle consumers run, not src/, so input parsing and the
      # step outputs are covered too.
      - run: npm run build
      - run: scripts/verify_live_prs.sh

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Pinned by hand: the extension is not a Python or npm package, and
      # Dependabot has no ecosystem for gh extensions, so nothing will bump
      # this. Raise it when gh-actions-lock releases a version worth having.
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
