name: Workflow Security

on:
  # Every pull request, with no paths filter, because this job is a required
  # status check on main. A workflow skipped by a paths filter leaves its check
  # pending rather than passing, so a required check that can be skipped blocks
  # every pull request the filter does not match.
  pull_request:
    branches: [main]
  # Several of zizmor's audits report on facts that live upstream rather than in
  # this repository: an action's repository being archived, a published advisory
  # against an action, a tag that has moved off the commit it named. None of
  # those change this repository, so nothing a pull request does brings them to
  # light. The weekly run does. Wednesday, so it does not land on the Tuesday
  # Scorecard analysis.
  schedule:
    - cron: "15 11 * * 3"
  workflow_dispatch: {}

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Without a token zizmor runs offline and skips every online audit with
      # only a warning, which would leave both the weekly run and every pull
      # request checking less than they appear to. The audits only read, so a
      # read-only token is enough.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3

      # Runs zizmor directly rather than through zizmorcore/zizmor-action, so
      # that its version lives in .github/tool-requirements.txt where Dependabot
      # updates it. `--format=github` reports findings as annotations, the same
      # as the action's `annotations: true`; the action's SARIF upload would need
      # `security-events: write`. zizmor exits non-zero on any finding, so the
      # job still fails. Mirrors the `lint:zizmor` npm script, spelled out here
      # because this job installs uv but no Node.
      - name: Audit the workflows
        run: >-
          uvx --constraints .github/tool-requirements.txt --from zizmor zizmor
          --format=github .github/workflows action.yml
