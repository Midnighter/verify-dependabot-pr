name: Workflow Security

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          # Pinned so that CI audits with a known zizmor version.
          version: 1.32.0
          inputs: .github/workflows
          # Report as annotations; uploading SARIF would need `security-events: write`.
          advanced-security: false
          annotations: true
