name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      # Pre-releases, e.g. 1.2.3-rc.1.
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Fetches main for the next step.
          fetch-depth: 0
      # A tag can point to any commit, including one that never went through
      # review on main.
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main."
            exit 1
          fi
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          # Don't restore a cache in a job that builds release artifacts.
          package-manager-cache: false
      # The bundle is built without running dependency install scripts.
      - run: npm ci --ignore-scripts
      # CI runs the ShellCheck and actionlint checks on main. They need uv, and
      # this job installs nothing beyond the npm packages.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # Only hands the bundle to the attest and release jobs.
          retention-days: 1

  attest:
    # Signs build provenance for the bundle. Holds the OIDC token permission,
    # so it runs no npm code and has no write access to the repository.
    needs: build
    permissions:
      id-token: write
      attestations: write
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest@v4.2.2
        with:
          subject-path: dist/index.js

  release:
    # Holds the write token, so it runs no npm code.
    needs: attest
    permissions:
      contents: write
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # The tags are pushed with the persisted credentials.
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked]
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      # main does not contain dist/, so the tag moves to a signed commit on top
      # of the pushed one that adds it. See the script for details.
      - name: Commit dist/ and move the release tag to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/create_release_commit.sh "${GITHUB_REF_NAME}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          gh release create "${TAG}" --verify-tag --title "${TAG}" --prerelease="${PRERELEASE}" --generate-notes \
            --notes "Please see https://github.com/${GH_REPO}/blob/${TAG}/CHANGELOG.md for the full release notes."
      - name: Update major version tag
        # Users of the major tag must not get pre-releases.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git fetch --force origin tag "${GITHUB_REF_NAME}"
          git tag --force "${MAJOR}" "${GITHUB_REF_NAME}"
          git push --force origin "refs/tags/${MAJOR}"
