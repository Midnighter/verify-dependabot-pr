name: Verify Dependabot PR
description: >
  Verify that a pull request is authored by Dependabot by checking author
  identity, account ID, and commit verification.
author: Midnighter

branding:
  icon: shield
  color: blue

inputs:
  github-token:
    description: GitHub token for API access.
    default: ${{ github.token }}
    required: false
  pr-number:
    description: PR number to verify.
    default: ${{ github.event.pull_request.number }}
    required: false
  expected-id:
    description: >
      Dependabot's numeric account ID. Set it only on GitHub Enterprise
      Server, whose Dependabot account has its own ID; on GitHub.com it must
      be 49699333.
    default: "49699333"
    required: false

outputs:
  verified:
    description: "true if all checks passed, false otherwise."
  reason:
    description: Human-readable failure reason (empty on success).
  checked-commit-count:
    description: Number of commits inspected.

runs:
  using: node24
  main: dist/index.js
