name: Verify Dependabot PR
description: >
  Verify that a pull request is authored by Dependabot by checking author
  identity, account ID, and commit verification.
author: Midnighter

branding:
  icon: shield
  color: blue

inputs:
  github-token:
    description: GitHub token for API access.
    default: ${{ github.token }}
    required: false
  pr-number:
    description: >
      Number of the PR to verify. On events other than pull_request, pass it
      together with head-sha.
    default: ${{ github.event.pull_request.number }}
    required: false
  head-sha:
    description: >
      Head commit SHA the workflow ran for. The action fails if the PR's head
      has moved on. Pass it together with pr-number.
    default: ${{ github.event.pull_request.head.sha }}
    required: false
  expected-id:
    description: >
      Dependabot's numeric account ID. Set it only on GitHub Enterprise
      Server, whose Dependabot account has its own ID; on GitHub.com it must
      be 49699333.
    default: "49699333"
    required: false
  expected-web-flow-id:
    description: >
      The numeric account ID of web-flow, the account GitHub signs its own
      commits as. Set it only on GitHub Enterprise Server, which has its own
      web-flow account; on GitHub.com it must be 19864447. Ask your instance
      administrator for the ID rather than looking it up by name.
    default: "19864447"
    required: false

outputs:
  verified:
    description: "true if all checks passed, false otherwise."
  reason:
    description: Human-readable failure reason (empty on success).
  checked-commit-count:
    description: Number of commits inspected.
  head-sha:
    description: >
      The head commit SHA that was verified (empty unless verified is true).
      Merge or approve only this commit.

runs:
  using: node24
  main: dist/index.js
